<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="assets/css/style.css" type="text/css">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
    <style>
        body {
            background: url("assets/pic/bg.png") no-repeat center center fixed;
            background-size: cover;
            color: #64002B;
        }

        .admin-shell {
            width: 82%;
            max-width: 1000px;
            margin: 60px auto;
            padding: 24px;
            background-color: rgba(255, 247, 247, 0.9);
            border: 2px solid #ffcccc;
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.12);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .admin-card {
            display: block;
            padding: 18px;
            min-height: 110px;
            background-color: rgba(255, 255, 255, 0.75);
            border: 2px outset rgba(199, 21, 133, 0.25);
            border-radius: 8px;
            text-decoration: none;
            color: #64002B;
        }

        .admin-card h3 {
            margin: 0 0 10px;
            color: MediumVioletRed;
        }

        .admin-card p {
            margin: 0;
            line-height: 1.7;
            color: #64002B;
        }
    </style>
</head>
<body>
    <div class="admin-shell">
        <h1 class="colorHead">Admin</h1>
        <div class="admin-grid">
            <a class="admin-card" href="notebook-admin.html">
                <h3>Notebook</h3>
                <p>Edit notebook-content.json.</p>
            </a>
            <a class="admin-card" href="gallery-admin.html">
                <h3>Gallery</h3>
                <p>Edit gallery groups and image metadata.</p>
            </a>
        </div>
    </div>
</body>
</html>
