<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Admin</title>
    <link rel="stylesheet" href="assets/css/style.css" type="text/css">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
    <script src="assets/js/admin-tools.js"></script>
    <style>
        body {
            background: url("assets/pic/bg.png") no-repeat center center fixed;
            background-size: cover;
            color: #64002B;
        }

        .admin-panel {
            width: 86%;
            max-width: 1280px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff7f7;
            border: 2px solid #ffcccc;
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.12);
        }

        .admin-toolbar,
        .admin-section {
            margin: 16px 0;
            padding: 14px;
            background-color: rgba(255, 255, 255, 0.72);
            border: 1px solid #ffcccc;
            border-radius: 8px;
        }

        .admin-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 180px;
            flex: 1;
        }

        .input-group label {
            color: maroon;
            font-size: 0.95em;
        }

        input,
        select,
        textarea,
        button {
            font-family: inherit;
        }

        input,
        select,
        textarea {
            padding: 8px;
            border: 1px solid #ffcccc;
            border-radius: 5px;
            color: #64002B;
            background-color: #fff;
        }

        button {
            background-color: #ffcccc;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            color: maroon;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background-color: #ffb3b3;
        }

        .group-block {
            margin: 16px 0;
            border: 1px solid #ffcccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: linear-gradient(145deg, #fff7f7, #ffe6e6);
            border-bottom: 1px solid #ffcccc;
        }

        .group-header input {
            max-width: 360px;
            font-size: 1.05em;
            font-weight: bold;
        }

        .gallery-admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            padding: 12px;
        }

        .gallery-admin-item {
            background-color: #fff7f7;
            border: 1px solid #ffcccc;
            border-radius: 8px;
            padding: 10px;
        }

        .gallery-admin-item img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 6px;
            background-color: #ffe6e6;
        }

        .item-fields {
            display: grid;
            gap: 6px;
            margin-top: 8px;
        }

        .item-actions {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
        }

        .move-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 8px;
        }

        .move-controls select {
            min-width: 0;
            flex: 1;
        }

        .selection-status {
            color: rgba(100, 0, 43, 0.72);
            font-size: 0.92em;
        }

        .field-note {
            margin: 4px 0 0;
            color: rgba(100, 0, 43, 0.7);
            font-size: 0.86em;
        }

        .empty-state {
            padding: 18px;
            text-align: center;
            color: rgba(100, 0, 43, 0.65);
        }
    </style>
</head>
<body>
    <div class="admin-panel">
        <h1 class="colorHead">Gallery Admin</h1>

        <div class="admin-toolbar">
            <div class="admin-row">
                <input type="file" id="importJsonInput" accept=".json" style="display: none;">
                <input type="file" id="imageFileInput" accept="image/*" multiple style="display: none;">
                <button onclick="document.getElementById('importJsonInput').click()">Import JSON</button>
                <button id="addImagesButton" onclick="document.getElementById('imageFileInput').click()">Add Images</button>
                <button onclick="addGroup()">Add Group</button>
                <button onclick="exportGalleryJson()">Export JSON</button>
                <button data-local-admin style="display: none;" onclick="saveGallery()">💾 保存</button>
                <button data-local-admin style="display: none;" onclick="adminApi.publishWithFeedback()">🚀 发布</button>
                <button onclick="window.location.href='admin.html'">Admin Home</button>
            </div>
            <div class="admin-row" data-local-admin style="display: none;">
                <span id="adminStatus" style="padding: 4px;"></span>
            </div>
        </div>

        <div class="admin-section">
            <div class="admin-row">
                <div class="input-group">
                    <label for="imageBasePath">Image path prefix (online/manual only)</label>
                    <input id="imageBasePath" value="assets/pic/gallery_photos">
                    <p class="field-note">Local uploads always go to <code>assets/pic/gallery_photos</code>. Use a folder path here, not a photo filename.</p>
                </div>
                <div class="input-group">
                    <label for="targetGroup">Target group</label>
                    <select id="targetGroup"></select>
                    <div>
                        <button id="moveSelectedButton" type="button">Move selected here</button>
                        <span id="selectionStatus" class="selection-status">0 selected</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="galleryGroups"></div>
    </div>

    <script>
        let galleryData = {
            imageBasePath: 'assets/pic/gallery_photos',
            groups: []
        };
        const DEFAULT_GALLERY_PATH = 'assets/pic/gallery_photos';
        const selectedItems = new Set();
        let isDirty = false;
        let isUploading = false;

        function slugify(value) {
            return String(value || 'gallery')
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '') || `group-${Date.now()}`;
        }

        function fileNameWithoutExt(name) {
            return name.replace(/\.[^.]+$/, '');
        }

        function normalizeImageBasePath(value) {
            const cleaned = String(value || DEFAULT_GALLERY_PATH)
                .trim()
                .replace(/\\/g, '/')
                .replace(/\/+$/, '');
            if (!cleaned || cleaned.split('/').includes('..')) return DEFAULT_GALLERY_PATH;
            // Earlier versions let a complete image path be stored in this directory field.
            return /\.(avif|gif|jpe?g|png|webp)$/i.test(cleaned)
                ? cleaned.replace(/\/[^/]+$/, '')
                : cleaned;
        }

        function markDirty() {
            isDirty = true;
            if (window.adminApi && adminApi.enabled && !isUploading) {
                adminApi.setStatus('有未保存的 Gallery 变更。');
            }
        }

        function updateSelectionUI() {
            const count = selectedItems.size;
            document.getElementById('selectionStatus').textContent = `${count} selected`;
            document.getElementById('moveSelectedButton').disabled = count === 0 || galleryData.groups.length === 0;
        }

        function normalizeGalleryData(data) {
            if (Array.isArray(data)) {
                return {
                    imageBasePath: 'assets/pic/gallery_photos',
                    groups: [{
                        id: 'dynamic-collection',
                        title: 'Dynamic Collection',
                        items: data.map(src => ({
                            src,
                            title: fileNameWithoutExt(src.split('/').pop() || src),
                            alt: fileNameWithoutExt(src.split('/').pop() || src)
                        }))
                    }]
                };
            }

            const source = data && typeof data === 'object' ? data : {};
            const groups = Array.isArray(source.groups) ? source.groups : [];
            const usedGroupIds = new Set();
            return {
                imageBasePath: normalizeImageBasePath(source.imageBasePath),
                groups: groups
                    .filter(group => group && typeof group === 'object')
                    .map((group, index) => {
                        const title = String(group.title || `Group ${index + 1}`);
                        const baseId = String(group.id || slugify(title));
                        let id = baseId;
                        let suffix = 2;
                        while (usedGroupIds.has(id)) id = `${baseId}-${suffix++}`;
                        usedGroupIds.add(id);
                        return {
                            id,
                            title,
                            items: (Array.isArray(group.items) ? group.items : [])
                                .filter(item => item && typeof item === 'object' && item.src)
                                .map(item => ({
                                    src: String(item.src),
                                    title: String(item.title || ''),
                                    alt: String(item.alt || '')
                                }))
                        };
                    })
            };
        }

        async function loadGalleryData() {
            try {
                const response = await fetch('data/gallery.json');
                if (!response.ok) throw new Error('Failed to load data/gallery.json');
                galleryData = normalizeGalleryData(await response.json());
            } catch (error) {
                console.error(error);
            }

            refreshUI();
        }

        function refreshUI() {
            document.getElementById('imageBasePath').value = normalizeImageBasePath(galleryData.imageBasePath);
            refreshGroupSelect();
            renderGroups();
            updateSelectionUI();
        }

        function refreshGroupSelect() {
            const select = document.getElementById('targetGroup');
            const selectedValue = select.value;
            select.innerHTML = '';

            galleryData.groups.forEach((group, index) => {
                const option = document.createElement('option');
                option.value = group.id;
                option.textContent = group.title || group.id || `Group ${index + 1}`;
                select.appendChild(option);
            });
            if ([...select.options].some(option => option.value === selectedValue)) {
                select.value = selectedValue;
            }
        }

        function getTargetGroupIndex() {
            const id = document.getElementById('targetGroup').value;
            return galleryData.groups.findIndex(group => group.id === id);
        }

        function renderGroups() {
            const container = document.getElementById('galleryGroups');
            container.innerHTML = '';

            if (galleryData.groups.length === 0) {
                container.innerHTML = '<div class="empty-state">No gallery groups.</div>';
                return;
            }

            galleryData.groups.forEach((group, groupIndex) => {
                const block = document.createElement('section');
                block.className = 'group-block';

                const header = document.createElement('div');
                header.className = 'group-header';
                const titleInput = document.createElement('input');
                titleInput.value = group.title || '';
                titleInput.setAttribute('aria-label', 'Group title');
                const actions = document.createElement('div');
                const upButton = document.createElement('button');
                const downButton = document.createElement('button');
                const deleteButton = document.createElement('button');
                upButton.type = downButton.type = deleteButton.type = 'button';
                upButton.textContent = 'Up';
                downButton.textContent = 'Down';
                deleteButton.textContent = 'Delete';
                actions.append(upButton, downButton, deleteButton);
                header.append(titleInput, actions);
                titleInput.addEventListener('input', () => {
                    group.title = titleInput.value;
                    group.id = group.id || slugify(group.title);
                    refreshGroupSelect();
                    markDirty();
                });

                upButton.addEventListener('click', () => moveGroup(groupIndex, -1));
                downButton.addEventListener('click', () => moveGroup(groupIndex, 1));
                deleteButton.addEventListener('click', () => deleteGroup(groupIndex));

                const grid = document.createElement('div');
                grid.className = 'gallery-admin-grid';

                (group.items || []).forEach((item, itemIndex) => {
                    grid.appendChild(renderItem(groupIndex, itemIndex, item));
                });

                block.appendChild(header);
                block.appendChild(grid);
                container.appendChild(block);
            });
        }

        function renderItem(groupIndex, itemIndex, item) {
            const card = document.createElement('div');
            card.className = 'gallery-admin-item';
            const image = document.createElement('img');
            image.src = item.src || '';
            image.alt = item.alt || item.title || '';
            const selectItem = document.createElement('input');
            selectItem.type = 'checkbox';
            selectItem.checked = selectedItems.has(item);
            selectItem.setAttribute('aria-label', 'Select image for moving');
            const fields = document.createElement('div');
            fields.className = 'item-fields';
            const srcInput = document.createElement('input');
            const titleInput = document.createElement('input');
            const altInput = document.createElement('input');
            srcInput.value = item.src || '';
            titleInput.value = item.title || '';
            altInput.value = item.alt || '';
            srcInput.setAttribute('aria-label', 'Image path');
            titleInput.setAttribute('aria-label', 'Image title');
            altInput.setAttribute('aria-label', 'Image alt');
            fields.append(srcInput, titleInput, altInput);
            const moveControls = document.createElement('div');
            moveControls.className = 'move-controls';
            const moveSelect = createGroupSelect(groupIndex);
            const moveButton = document.createElement('button');
            moveButton.type = 'button';
            moveButton.textContent = 'Move';
            moveButton.disabled = galleryData.groups.length < 2 || Number(moveSelect.value) === groupIndex;
            moveControls.append(moveSelect, moveButton);
            const itemActions = document.createElement('div');
            itemActions.className = 'item-actions';
            const orderActions = document.createElement('span');
            const upButton = document.createElement('button');
            const downButton = document.createElement('button');
            const deleteButton = document.createElement('button');
            upButton.type = downButton.type = deleteButton.type = 'button';
            upButton.textContent = 'Up';
            downButton.textContent = 'Down';
            deleteButton.textContent = 'Delete';
            orderActions.append(upButton, downButton);
            itemActions.append(orderActions, deleteButton);
            card.append(image, selectItem, fields, moveControls, itemActions);

            selectItem.addEventListener('change', () => {
                if (selectItem.checked) selectedItems.add(item);
                else selectedItems.delete(item);
                updateSelectionUI();
            });
            srcInput.addEventListener('input', () => {
                item.src = srcInput.value;
                image.src = item.src;
                markDirty();
            });
            titleInput.addEventListener('input', () => {
                item.title = titleInput.value;
                markDirty();
            });
            altInput.addEventListener('input', () => {
                item.alt = altInput.value;
                image.alt = item.alt;
                markDirty();
            });
            moveSelect.addEventListener('change', () => {
                moveButton.disabled = Number(moveSelect.value) === groupIndex;
            });
            moveButton.addEventListener('click', () => moveItemToGroup(groupIndex, itemIndex, Number(moveSelect.value)));
            upButton.addEventListener('click', () => moveItem(groupIndex, itemIndex, -1));
            downButton.addEventListener('click', () => moveItem(groupIndex, itemIndex, 1));
            deleteButton.addEventListener('click', () => deleteItem(groupIndex, itemIndex));

            return card;
        }

        function createGroupSelect(selectedIndex) {
            const select = document.createElement('select');
            select.setAttribute('aria-label', 'Move image to group');
            galleryData.groups.forEach((group, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = group.title || group.id || `Group ${index + 1}`;
                select.appendChild(option);
            });
            select.value = String(selectedIndex);
            return select;
        }

        function addGroup() {
            const title = `New Group ${galleryData.groups.length + 1}`;
            galleryData.groups.push({
                id: slugify(title),
                title,
                items: []
            });
            markDirty();
            refreshUI();
        }

        function deleteGroup(index) {
            const count = (galleryData.groups[index].items || []).length;
            if (confirm(`Delete this group and remove its ${count} photo reference(s) from gallery.json? The image files will stay on disk.`)) {
                (galleryData.groups[index].items || []).forEach(item => selectedItems.delete(item));
                galleryData.groups.splice(index, 1);
                markDirty();
                refreshUI();
            }
        }

        function moveGroup(index, direction) {
            const target = index + direction;
            if (target < 0 || target >= galleryData.groups.length) return;
            const [group] = galleryData.groups.splice(index, 1);
            galleryData.groups.splice(target, 0, group);
            markDirty();
            refreshUI();
        }

        function moveItem(groupIndex, itemIndex, direction) {
            const items = galleryData.groups[groupIndex].items;
            const target = itemIndex + direction;
            if (target < 0 || target >= items.length) return;
            const [item] = items.splice(itemIndex, 1);
            items.splice(target, 0, item);
            markDirty();
            refreshUI();
        }

        function deleteItem(groupIndex, itemIndex) {
            const item = galleryData.groups[groupIndex].items[itemIndex];
            if (!confirm('Remove this photo from gallery.json? The image file will stay on disk.')) return;
            selectedItems.delete(item);
            galleryData.groups[groupIndex].items.splice(itemIndex, 1);
            markDirty();
            refreshUI();
        }

        function moveItemToGroup(fromGroupIndex, itemIndex, toGroupIndex) {
            if (fromGroupIndex === toGroupIndex || !galleryData.groups[toGroupIndex]) return;
            const [item] = galleryData.groups[fromGroupIndex].items.splice(itemIndex, 1);
            galleryData.groups[toGroupIndex].items = galleryData.groups[toGroupIndex].items || [];
            galleryData.groups[toGroupIndex].items.push(item);
            markDirty();
            refreshUI();
        }

        function moveSelectedItems() {
            const targetIndex = getTargetGroupIndex();
            if (targetIndex < 0) return;
            const targetItems = galleryData.groups[targetIndex].items = galleryData.groups[targetIndex].items || [];
            let moved = 0;
            galleryData.groups.forEach((group, groupIndex) => {
                if (groupIndex === targetIndex) return;
                const moving = (group.items || []).filter(item => selectedItems.has(item));
                if (!moving.length) return;
                group.items = group.items.filter(item => !selectedItems.has(item));
                targetItems.push(...moving);
                moved += moving.length;
            });
            if (!moved) return;
            markDirty();
            refreshUI();
            if (window.adminApi && adminApi.enabled) {
                adminApi.setStatus(`Moved ${moved} selected photo(s). Remember to save.`);
            }
        }

        async function addImages(files) {
            const selectedFiles = [...files];
            if (!selectedFiles.length || isUploading) return;
            if (galleryData.groups.length === 0) {
                addGroup();
            }

            const groupIndex = Math.max(0, getTargetGroupIndex());
            const group = galleryData.groups[groupIndex];
            const basePath = normalizeImageBasePath(document.getElementById('imageBasePath').value);
            galleryData.imageBasePath = basePath;
            group.items = group.items || [];

            if (window.adminApi && adminApi.enabled) {
                isUploading = true;
                document.getElementById('addImagesButton').disabled = true;
                let successCount = 0;
                const failures = [];
                // 本地管理服务器：真上传，文件直接写进 assets/pic/gallery_photos/
                for (const file of selectedFiles) {
                    try {
                        adminApi.setStatus(`上传中：${file.name} ……`);
                        const uploaded = await adminApi.upload('gallery', file);
                        const title = fileNameWithoutExt(uploaded.name);
                        group.items.push({ src: uploaded.path, title, alt: title });
                        successCount += 1;
                    } catch (error) {
                        failures.push(`${file.name}: ${error.message}`);
                    }
                }
                isUploading = false;
                document.getElementById('addImagesButton').disabled = false;
                if (successCount) markDirty();
                const message = `Uploaded ${successCount} of ${selectedFiles.length} image(s). ${successCount ? 'Remember to save.' : ''}`;
                adminApi.setStatus(failures.length ? `${message} Failed: ${failures.join('; ')}` : message, failures.length > 0);
            } else {
                // 线上/无服务器兜底：只登记路径，需自己把文件放进对应目录
                selectedFiles.forEach(file => {
                    const title = fileNameWithoutExt(file.name);
                    group.items.push({
                        src: `${basePath}/${file.name}`,
                        title,
                        alt: title
                    });
                });
                markDirty();
            }

            refreshUI();
        }

        async function saveGallery() {
            galleryData.imageBasePath = normalizeImageBasePath(document.getElementById('imageBasePath').value);
            galleryData.groups.forEach(group => {
                group.id = group.id || slugify(group.title);
                group.items = group.items || [];
            });

            try {
                await adminApi.save('data/gallery.json', galleryData);
                isDirty = false;
                adminApi.setStatus('已保存到 data/gallery.json ✓（点「发布」推送上线）');
            } catch (error) {
                adminApi.setStatus(`保存失败：${error.message}`, true);
            }
        }

        function exportGalleryJson() {
            galleryData.imageBasePath = normalizeImageBasePath(document.getElementById('imageBasePath').value);
            galleryData.groups.forEach(group => {
                group.id = group.id || slugify(group.title);
                group.items = group.items || [];
            });

            const blob = new Blob([JSON.stringify(galleryData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'gallery.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            isDirty = false;
        }

        document.getElementById('imageBasePath').addEventListener('input', event => {
            galleryData.imageBasePath = normalizeImageBasePath(event.target.value);
            markDirty();
        });

        document.getElementById('imageBasePath').addEventListener('blur', event => {
            event.target.value = normalizeImageBasePath(event.target.value);
        });

        document.getElementById('moveSelectedButton').addEventListener('click', moveSelectedItems);

        document.getElementById('imageFileInput').addEventListener('change', event => {
            const selectedFiles = [...event.target.files];
            event.target.value = '';
            addImages(selectedFiles);
        });

        document.getElementById('importJsonInput').addEventListener('change', event => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                try {
                    galleryData = normalizeGalleryData(JSON.parse(reader.result));
                    selectedItems.clear();
                    markDirty();
                    refreshUI();
                } catch (error) {
                    alert('Invalid gallery JSON.');
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        });

        window.addEventListener('beforeunload', event => {
            if (!isDirty) return;
            event.preventDefault();
            event.returnValue = '';
        });

        document.addEventListener('DOMContentLoaded', loadGalleryData);
    </script>
</body>
</html>
